name: PjDigitalServices background worker

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/background-worker.yml"

concurrency:
  group: pjdigitalservices-fulfillment-worker
  cancel-in-progress: false

jobs:
  fulfill:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Run payment and fulfillment worker
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error --location --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -X POST \
            "https://www.pjdigitalservices.online/api/jobs/fulfill"
